name: Tardi
options:
  bundleIdPrefix: com.cmccoy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  Tardi:
    type: application
    platform: iOS
    sources:
      - path: Tardi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmccoy.tardi
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Tardi/Info.plist
      properties:
        CFBundleDisplayName: "Tardi"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "Tardi needs your location to verify you're at a commitment's location when you create it."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Tardi checks your location in the background so it can tell whether you were at a commitment's location by its deadline, even when the app isn't open."
